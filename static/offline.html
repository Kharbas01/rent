<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline · RentFlow</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #eef1f9; color: #0f172a;
      display: grid; place-items: center; text-align: center; padding: 24px;
    }
    .card { max-width: 380px; }
    .badge {
      width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 18px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: grid; place-items: center; color: #fff; font-size: 28px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #475569; line-height: 1.5; margin: 0 0 20px; }
    button {
      border: none; border-radius: 12px; padding: 10px 18px; font-weight: 600;
      background: #6366f1; color: #fff; cursor: pointer; font-size: 0.9rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #070b18; color: #eef2ff; }
      p { color: #b3bdd6; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" aria-hidden="true">&#128268;</div>
    <h1>You're offline</h1>
    <p>This page hasn't been cached yet, and there's no internet connection right now. Reconnect and try again — anything you already viewed is still available.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
